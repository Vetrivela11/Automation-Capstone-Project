[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-python-automation"
version = "1.0.0"
description = "CSV-driven automated PDF reporting with a command-line interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["reportlab>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
report-automation = "report_automation.cli:main"

[tool.setuptools.packages.find]
include = ["report_automation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
